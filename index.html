  }

  }

  .container {

    justify-content: center;
    gap: 12px;
    max-width: 500px;
    margin: 0 auto;
  }
  .card {

    border-radius: 12px;
    padding: 8px;
    flex: 1;

    height: 200px;

let selectedIndices = new Set();
let selectedItems = [];

// 一覧画面の生成
function renderSelectionGrid() {
  const grid = document.getElementById("selectGrid");
  grid.innerHTML = allItems.map((item, idx) => `
    <div class="select-item" id="item-${idx}" onclick="toggleSelect(${idx})">
      <img src="${item.img}" alt="${item.name}">
      <div class="name">${item.name}</div>
    </div>
  `).join('');
}

function toggleSelect(idx) {
  const el = document.getElementById(`item-${idx}`);
  if (selectedIndices.has(idx)) {
    selectedIndices.delete(idx);
    el.classList.remove("selected");
  } else {
    selectedIndices.add(idx);
    el.classList.add("selected");
  }
  
  const count = selectedIndices.size;
  const btn = document.getElementById("startBtn");
  if (count >= 9) {
    btn.disabled = false;
    btn.innerText = `選んだ ${count} 人で2択スタート！`;
  } else {
    btn.disabled = true;
    btn.innerText = `9人以上選んでね（現在 ${count}人）`;
  }
}

// 2択ソートロジック
let mergeList = [];
let nextMergeList = [];
let left = [], right = [], resultChunk = [];
let currentStep = 0;

function startSorting() {
  selectedItems = Array.from(selectedIndices).map(idx => allItems[idx]);
  document.getElementById("selection-phase").style.display = "none";
  document.getElementById("game").style.display = "block";
  
  mergeList = selectedItems.map(item => [item]);
  shuffle(mergeList);
  prepareNextStep();
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function prepareNextStep() {
  if (mergeList.length <= 1 && left.length === 0 && right.length === 0) {
    showResult(mergeList[0] || []);
    return;
  }
  if (left.length === 0 && right.length === 0) {
    if (mergeList.length === 1) {
      mergeList = nextMergeList.concat(mergeList);
      nextMergeList = [];
    }
    if (mergeList.length >= 2) {
      left = mergeList.shift();
      right = mergeList.shift();
      resultChunk = [];
    }
  }
  
  if (left.length > 0 && right.length > 0) {
    currentStep++;
    document.getElementById("progress").innerText = `2択比較中... (${currentStep}回目)`;
    renderCard(0, left[0]);
    renderCard(1, right[0]);
  }
}

function renderCard(idx, item) {
  document.getElementById(`img${idx}`).src = item.img;
  document.getElementById(`name${idx}`).innerText = item.name;
}

function choose(selectedIdx) {
  if (selectedIdx === 0) {
    resultChunk.push(left.shift());
  } else {
    resultChunk.push(right.shift());
  }

  if (left.length === 0 || right.length === 0) {
    resultChunk = resultChunk.concat(left).concat(right);
    left = [];
    right = [];
    nextMergeList.push(resultChunk);
  }
  prepareNextStep();
}

function showResult(sortedList) {
  document.getElementById("game").style.display = "none";
  const resultDiv = document.getElementById("result");
  const grid = document.getElementById("resultGrid");
  resultDiv.style.display = "block";
  
  const top9 = sortedList.slice(0, 9);
  grid.innerHTML = top9.map((item, i) => `
    <div class="grid-item">
      <span class="rank-badge">${i + 1}位</span>
      <img src="${item.img}">
      <div class="grid-name">${item.name}</div>
    </div>
  `).join('');
}

window.onload = renderSelectionGrid;
