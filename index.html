      font-size: 1.3rem;
      margin-bottom: 12px;
      color: var(--primary-color);

      justify-content: space-between;
      align-items: center;

    .counter {
      font-weight: bold;
      font-size: 0.95rem;

    .pagination {
      text-align: center;
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: #666;
    }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .item-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s, transform 0.1s;
    }

    .item-card.selected {
      border-color: var(--primary-color);
      background-color: #fffdf5;
    }

    .item-card.selected::after {
      content: "✓";
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--primary-color);
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .img-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #eee;
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-info {
      padding: 6px;
      text-align: center;
    }

    .group-name {
      font-size: 0.7rem;
      color: #777;
    }

    .person-name {
      font-size: 0.85rem;
      font-weight: bold;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background-color: #e0e0e0;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button.primary {
      background-color: var(--primary-color);
      color: white;
    }

    let selectedIndices = [];

    // バトル用変数
    let battleCandidates = [];
    let battleScores = {};
    let battlePairs = [];
    let currentPairIndex = 0;

    function startApp() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('main-screen').style.display = 'block';
      renderPage();
    }

    function renderPage() {
      const totalPages = Math.ceil(allItems.length / ITEMS_PER_PAGE);
      document.getElementById('page-indicator').textContent = `${currentPage} / ${totalPages} ページ`;

      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, allItems.length);
      const currentItems = allItems.slice(startIndex, endIndex);

      const grid = document.getElementById('item-grid');
      grid.innerHTML = '';

      currentItems.forEach((item, index) => {
        const globalIndex = startIndex + index;
        const isSelected = selectedIndices.includes(globalIndex);

        const card = document.createElement('div');
        card.className = `item-card ${isSelected ? 'selected' : ''}`;
        card.onclick = () => toggleSelect(globalIndex);

        card.innerHTML = `
          <div class="img-container">
            <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
          </div>
          <div class="item-info">
            <div class="group-name">${item.group || '&nbsp;'}</div>
            <div class="person-name">${item.name}</div>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('prev-btn').disabled = currentPage === 1;
      document.getElementById('next-btn').disabled = currentPage === totalPages;

      updateCounter();
    }

    function changePage(delta) {
      currentPage += delta;
      renderPage();
      window.scrollTo(0, 0);
    }

    function toggleSelect(index) {
      const pos = selectedIndices.indexOf(index);
      if (pos > -1) {
        selectedIndices.splice(pos, 1);
      } else {
        selectedIndices.push(index);
      }
      renderPage();
    }

    function toggleSelectAllPage() {
      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, allItems.length);
      
      let allSelected = true;
      for (let i = startIndex; i < endIndex; i++) {
        if (!selectedIndices.includes(i)) {
          allSelected = false;
          break;
        }
      }

      for (let i = startIndex; i < endIndex; i++) {
        if (allSelected) {
          const pos = selectedIndices.indexOf(i);
          if (pos > -1) selectedIndices.splice(pos, 1);
        } else {
          if (!selectedIndices.includes(i)) selectedIndices.push(i);
        }
      }
      renderPage();
    }

    function updateCounter() {
      const count = selectedIndices.length;
      document.getElementById('select-counter').textContent = `選択中: ${count}人`;

      const btn = document.getElementById('complete-btn');
      if (count >= 9) {
        btn.disabled = false;
        btn.textContent = `二者択一でランキングを決定する (選択: ${count}人)`;
      } else {
        btn.disabled = true;
        btn.textContent = `9人以上選んでね (現在 ${count}人)`;
      }
    }

    // 二者択一フェーズの開始
    function startBattlePhase() {
      battleCandidates = selectedIndices.map(i => allItems[i]);
      battleScores = {};
      battleCandidates.forEach((c, idx) => { battleScores[idx] = 0; });

      // 対戦ペアのリストを多めに生成
      battlePairs = [];
      const n = battleCandidates.length;
      
      // 人数に応じたラウンド数（多めに設定して順位を確実にする）
      let totalRounds = 5;
      if (n > 15) totalRounds = 6;
      if (n > 30) totalRounds = 8;
      if (n > 50) totalRounds = 10;

      for (let r = 0; r < totalRounds; r++) {
        let pool = [...Array(n).keys()];
        pool = shuffleArray(pool);
        for (let i = 0; i < pool.length - 1; i += 2) {
          battlePairs.push([pool[i], pool[i+1]]);
        }
      }

      currentPairIndex = 0;
      document.getElementById('main-screen').style.display = 'none';
      document.getElementById('battle-screen').style.display = 'block';
      renderBattle();
    }

    function renderBattle() {
      if (currentPairIndex >= battlePairs.length) {
        finishBattle();
        return;
      }

      const pair = battlePairs[currentPairIndex];
      const itemA = battleCandidates[pair[0]];
      const itemB = battleCandidates[pair[1]];

      document.getElementById('battle-progress').textContent = `対決 ${currentPairIndex + 1} / ${battlePairs.length}`;

      document.getElementById('img-a').src = itemA.img;
      document.getElementById('group-a').textContent = itemA.group || '\u00A0';
      document.getElementById('name-a').textContent = itemA.name;

      document.getElementById('img-b').src = itemB.img;
      document.getElementById('group-b').textContent = itemB.group || '\u00A0';
      document.getElementById('name-b').textContent = itemB.name;
    }

    function chooseBattle(winnerSide) {
      const pair = battlePairs[currentPairIndex];
      const winnerIndex = pair[winnerSide];
      battleScores[winnerIndex] += 1;

      currentPairIndex++;
      renderBattle();
    }

    function finishBattle() {
      // スコア順にソート（同点の場合はランダム要素で順位固定）
      const sorted = Object.keys(battleScores).sort((a, b) => {
        if (battleScores[b] === battleScores[a]) {
          return Math.random() - 0.5;
        }
        return battleScores[b] - battleScores[a];
      });

      const top9 = sorted.slice(0, 9).map(idx => battleCandidates[idx]);

      document.getElementById('battle-screen').style.display = 'none';
      showResult(top9);
    }

    function showResult(top9Items) {
      document.getElementById('main-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'block';

      const resultGrid = document.getElementById('result-grid');
      resultGrid.innerHTML = '';

      top9Items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'grid-3x3-item';
        div.innerHTML = `
          <div class="rank-badge">${index + 1}位</div>
          <img src="${item.img}" alt="${item.name}">
          <div class="grid-3x3-name">${item.name}</div>
        `;
        resultGrid.appendChild(div);
      });
    }

    function backToSelect() {
      document.getElementById('result-screen').style.display = 'none';
      document.getElementById('battle-screen').style.display = 'none';
      document.getElementById('main-screen').style.display = 'block';
    }

    function downloadImage() {
      const area = document.getElementById('capture-area');
      html2canvas(area).then(canvas => {
        const link = document.createElement('a');
        link.download = 'my-sukigao-9.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    function shareTwitter() {
      const text = encodeURIComponent("サンミュージック GETライブの好き顔9選を作ったよ！ #サンミュージックGETライブ好き顔9選");
      const url = `https://twitter.com/intent/tweet?text=${text}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
